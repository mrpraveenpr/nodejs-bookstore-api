name: SBOM Generation + Merge + Push + FOSSA Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/fossa-sbom

jobs:
  sbom-full-pipeline:
    name: Generate, Merge, Push, and Upload SBOM
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      TOKEN: ${{ secrets.SBOM_PUSH_TOKEN }}
      FOSSA_PROJECT_ID: ${{ secrets.FOSSA_PROJECT_ID }} # Ensure this secret is set in your repo

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Checkout source code
      # -----------------------------------------------------------
      - name: 🧩 Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2️⃣ Setup Node.js
      # -----------------------------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------
      # 3️⃣ Install dependencies
      # -----------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci

      # -----------------------------------------------------------
      # 4️⃣ Patch global.File (cdxgen fix)
      # -----------------------------------------------------------
      - name: 🩹 Patch global.File
        run: |
          cat > /tmp/file-shim.js <<'JS'
          const { Blob } = globalThis;
          if (typeof globalThis.File === 'undefined') {
            globalThis.File = class File extends Blob {
              constructor(bits = [], name = 'file', options = {}) {
                super(bits, options);
                this.name = name;
                this.lastModified = options.lastModified || Date.now();
              }
            };
          }
          JS

      # -----------------------------------------------------------
      # 5️⃣ Generate Application SBOM
      # -----------------------------------------------------------
      - name: 🧾 Generate Application SBOM
        run: |
          NODE_OPTIONS="-r /tmp/file-shim.js" npx --yes @cyclonedx/cdxgen@latest -t nodejs -o app-sbom.cdx.json
          echo "✅ Application SBOM created → $(pwd)/app-sbom.cdx.json"

      # -----------------------------------------------------------
      # 6️⃣ Build Docker image
      # -----------------------------------------------------------
      - name: 🏗️ Build container image
        run: |
          docker build -t bookstore:latest .
          docker save bookstore:latest -o bookstore.tar
          echo "✅ Docker image built successfully."

      # -----------------------------------------------------------
      # 7️⃣ Install Trivy
      # -----------------------------------------------------------
      - name: 🔧 Install Trivy
        run: |
          TRIVY_VER=$(curl -sSL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VER}/trivy_${TRIVY_VER#v}_Linux-64bit.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # -----------------------------------------------------------
      # 8️⃣ Generate Container SBOM
      # -----------------------------------------------------------
      - name: 🧱 Generate Container SBOM
        run: |
          echo "🔍 Generating container SBOM..."
          trivy image --format cyclonedx --scanners vuln --output container-sbom.cdx.json bookstore:latest
          echo "✅ Container SBOM created → $(pwd)/container-sbom.cdx.json"

      # -----------------------------------------------------------
      # 9️⃣ Install CycloneDX CLI for merging (FIXED)
      # -----------------------------------------------------------
      # -----------------------------------------------------------
      # 9️⃣ Install CycloneDX CLI for merging (FIXED)
      # -----------------------------------------------------------
      - name: 🧰 Install CycloneDX CLI
        run: |
         set -euo pipefail
         echo "📦 Installing CycloneDX CLI (binary)..."
         curl -sSL -o cyclonedx.zip \
         https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.29.1/cyclonedx-cli-0.29.1-linux-x64.zip
         unzip -q cyclonedx.zip
         chmod +x cyclonedx-cli
         sudo mv cyclonedx-cli /usr/local/bin/cyclonedx
         echo "✅ CycloneDX CLI installed successfully!"
         cyclonedx --version

      # -----------------------------------------------------------
      # 🔟 Upload both SBOMs as artifacts
      # -----------------------------------------------------------
      - name: 📤 Upload SBOMs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: |
            app-sbom.cdx.json
            container-sbom.cdx.json

      # -----------------------------------------------------------
      # 1️⃣1️⃣ Push SBOMs to sbom-manager and merge them
      # -----------------------------------------------------------
      - name: 🚀 Push and Merge SBOMs in sbom-manager
        run: |
          echo "📦 Cloning sbom-manager repo..."
          git config --global user.email "praveenvijay140@gmail.com"
          git config --global user.name "GitHub Actions Bot"
          git clone https://x-access-token:${TOKEN}@github.com/mrpraveenpr/sbom-manager.git

          echo "📁 Preparing nodejs-bookstore-api folder..."
          mkdir -p sbom-manager/sboms/nodejs-bookstore-api
          cp app-sbom.cdx.json sbom-manager/sboms/nodejs-bookstore-api/
          cp container-sbom.cdx.json sbom-manager/sboms/nodejs-bookstore-api/

          cd sbom-manager/sboms/nodejs-bookstore-api

          echo "🧩 Merging SBOM files..."
          cyclonedx merge -o merged-sbom.cdx.json app-sbom.cdx.json container-sbom.cdx.json
          echo "✅ Merged SBOM created → merged-sbom.cdx.json"

          echo "📦 Archiving old SBOMs..."
          mkdir -p old
          timestamp=$(date +'%Y%m%d_%H%M%S')
          mv app-sbom.cdx.json old/app-sbom-${timestamp}.cdx.json
          mv container-sbom.cdx.json old/container-sbom-${timestamp}.cdx.json

          echo "💾 Commit merged SBOM to sbom-manager..."
          cd ../../
          git add sboms/nodejs-bookstore-api/merged-sbom.cdx.json
          git add sboms/nodejs-bookstore-api/old/
          git commit -m "Merged + archived SBOM for nodejs-bookstore-api - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main
          echo "✅ Merged SBOM pushed and old files archived."

      # -----------------------------------------------------------
      # 1️⃣1️⃣b Install FOSSA CLI (NEW STEP)
      # -----------------------------------------------------------
      - name: 🔧 Install FOSSA CLI
        run: |
          set -euo pipefail
          echo "📦 Installing FOSSA CLI using official install script..."
          
          # Use the official install script
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sudo bash
          
          echo "✅ Installed FOSSA CLI → $(fossa --version)"
          echo ""
          
          echo "🔑 Verifying FOSSA token..."
          fossa list-targets --api-key "${FOSSA_API_KEY}" || { echo "❌ Invalid or expired FOSSA API key"; exit 1; }
          echo "✅ FOSSA token verified."

      # -----------------------------------------------------------
      # 1️⃣2️⃣ Upload merged SBOM to FOSSA
      # -----------------------------------------------------------
      - name: 🔐 Upload Merged SBOM to FOSSA
        run: |
          echo "🔄 Uploading merged SBOM to FOSSA..."
          # Need to be in the correct directory where the merged file is
          cd sbom-manager/sboms/nodejs-bookstore-api
          
          echo "Located merged file at $(pwd)/merged-sbom.cdx.json"
          
          fossa sbom upload \
            --api-key "${FOSSA_API_KEY}" \
            --file merged-sbom.cdx.json \
            --project-id $FOSSA_PROJECT_ID || { echo "❌ FOSSA upload failed"; exit 1; }
            
          echo "✅ Merged SBOM uploaded to FOSSA successfully."