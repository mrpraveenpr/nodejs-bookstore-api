name: 🧩 SBOM Generation + Push to sbom-manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
  

jobs:
  sbom-full-pipeline:
    name: Generate and Push SBOMs to sbom-manager
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SBOM_PUSH_TOKEN }}
      FOSSA_TELEMETRY_SCOPE: off
      PROJECT_NAME: ${{ github.event.repository.name }}

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Checkout Source Code
      # -----------------------------------------------------------
      - name: 🧩 Checkout Source
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2️⃣ Setup Node.js
      # -----------------------------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------
      # 3️⃣ Install dependencies
      # -----------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci || echo "⚠️ No package-lock.json found — skipping strict install."

      # -----------------------------------------------------------
      # 4️⃣ Patch global.File (cdxgen fix)
      # -----------------------------------------------------------
      - name: 🩹 Patch global.File (for cdxgen)
        run: |
          cat > /tmp/file-shim.js <<'JS'
          const { Blob } = globalThis;
          if (typeof globalThis.File === 'undefined') {
            globalThis.File = class File extends Blob {
              constructor(bits = [], name = 'file', options = {}) {
                super(bits, options);
                this.name = name;
                this.lastModified = options.lastModified || Date.now();
              }
            };
          }
          JS

      # -----------------------------------------------------------
      # 5️⃣ Generate Application SBOM
      # -----------------------------------------------------------
      - name: 🧾 Generate Application SBOM
        run: |
          echo "🔍 Generating Node.js application SBOM..."
          npm install -g @cyclonedx/cdxgen@10.10.3
          NODE_OPTIONS="-r /tmp/file-shim.js" cdxgen -t nodejs -r -o app-sbom.cdx.json
          echo "✅ Application SBOM created → $(pwd)/app-sbom.cdx.json"

      # -----------------------------------------------------------
      # 6️⃣ Build Docker Image
      # -----------------------------------------------------------
      - name: 🏗️ Build Docker Image
        run: |
          echo "🏗️ Building Docker image for ${PROJECT_NAME}..."
          docker build -t ${PROJECT_NAME}:latest .
          echo "✅ Docker image built successfully."

      # -----------------------------------------------------------
      # 7️⃣ Install Trivy
      # -----------------------------------------------------------
      - name: 🔧 Install Trivy
        run: |
          TRIVY_VER=$(curl -sSL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VER}/trivy_${TRIVY_VER#v}_Linux-64bit.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # -----------------------------------------------------------
      # 8️⃣ Generate Container SBOM
      # -----------------------------------------------------------
      - name: 🧱 Generate Container SBOM
        run: |
          echo "🔍 Generating container SBOM using Trivy..."
          trivy image --format cyclonedx --list-all-pkgs --output container-sbom.cdx.json ${PROJECT_NAME}:latest
          echo "✅ Container SBOM created → $(pwd)/container-sbom.cdx.json"

      # -----------------------------------------------------------
      # 9️⃣ Upload SBOMs as Artifacts (for visibility)
      # -----------------------------------------------------------
      - name: 📤 Upload SBOMs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-sboms
          path: |
            app-sbom.cdx.json
            container-sbom.cdx.json

      # -----------------------------------------------------------
      # 🔟 Push SBOMs to sbom-manager repo
      # -----------------------------------------------------------
      - name: 🚀 Push SBOMs to sbom-manager
        run: |
          echo "📦 Cloning sbom-manager repository..."
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"

          git clone https://x-access-token:${TOKEN}@github.com/mrpraveenpr/sbom-manager.git

          TARGET_DIR="sbom-manager/sboms/${PROJECT_NAME}"
          mkdir -p "$TARGET_DIR"

          echo "📁 Copying SBOM files to ${TARGET_DIR}..."
          cp app-sbom.cdx.json "$TARGET_DIR/"
          cp container-sbom.cdx.json "$TARGET_DIR/"

          cd sbom-manager
          git add .
          git commit -m "📦 SBOMs updated for ${PROJECT_NAME} - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "ℹ️ No new changes to commit."
          git push origin main
          echo "✅ SBOMs successfully pushed to sbom-manager/sboms/${PROJECT_NAME}"
