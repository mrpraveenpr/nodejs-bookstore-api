name: SBOM Release Process

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Enter Release Name (e.g., release-1.0.0)"
        required: true
        type: string

jobs:
  sbom-process:
    runs-on: ubuntu-latest

    steps:
      # Checkout the source repository
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t orgin-medical:latest .

      # Install CycloneDX cdxgen
      - name: Install cdxgen
        run: |
          npm install -g @cyclonedx/cdxgen

      # Generate SBOM for source code
      - name: Generate SBOM (Source Code)
        run: |
          cdxgen -o sbom-source.json .

      # Generate SBOM for Docker image
      - name: Generate SBOM (Docker Image)
        run: |
          cdxgen -t docker -o sbom-docker.json orgin-medical:latest

      # Clone SBOM Manager repository
      - name: Clone SBOM Manager Repository
        run: |
          git clone https://${{ secrets.SBOM_MANAGER_USERNAME }}:${{ secrets.SBOM_MANAGER_TOKEN }}@github.com/${{ secrets.SBOM_MANAGER_REPO }} sbom-manager

      # Create a new branch for this release
      - name: Create Release Branch
        working-directory: sbom-manager
        run: |
          RELEASE="${{ github.event.inputs.release_name }}"
          git checkout -b "$RELEASE"

      # Copy generated SBOM files into SBOM Manager repo
      - name: Copy SBOM Files
        run: |
          cp sbom-source.json sbom-manager/
          cp sbom-docker.json sbom-manager/

      # Commit and push SBOM files
      - name: Commit and Push SBOM Files
        working-directory: sbom-manager
        run: |
          RELEASE="${{ github.event.inputs.release_name }}"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Add SBOM files for release $RELEASE"
          git push origin "$RELEASE"

      # Upload SBOM artifacts (optional)
      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: |
            sbom-source.json
            sbom-docker.json
