name: Upload existing SBOMs to FOSSA

on:
  workflow_dispatch:  # 👈 allows you to manually trigger this job from GitHub Actions tab

jobs:
  upload-fossa:
    name: Upload SBOMs from previous run to FOSSA
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Download SBOM artifact (from previous CycloneDX workflow)
      # -----------------------------------------------------------
      - name: 🔽 Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: ./sboms

      # -----------------------------------------------------------
      # 2️⃣ Verify downloaded SBOM files
      # -----------------------------------------------------------
      - name: 🧾 Verify SBOM files
        run: |
          echo "✅ SBOM files downloaded:"
          ls -lh ./sboms
          echo ""
          echo "📄 Application SBOM preview:"
          head -n 10 ./sboms/app-sbom.cdx.json || true
          echo ""
          echo "📦 Container SBOM preview:"
          head -n 10 ./sboms/container-sbom.cdx.json || true

      # -----------------------------------------------------------
      # 3️⃣ Upload Application + Container SBOMs to FOSSA
      # -----------------------------------------------------------
      - name: ☁️ Upload SBOMs to FOSSA
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}"
          REVISION="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}" || BRANCH="${{ github.ref }}"  # fallback if ref_name not available

          echo "🔗 Uploading to FOSSA for:"
          echo "   Repo: ${REPO_URL}"
          echo "   Revision: ${REVISION}"
          echo "   Branch: ${BRANCH}"
          echo ""

          echo "☁️ Uploading Application SBOM to FOSSA..."
          http_code_app=$(curl -s -S -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "project[name]=${REPO_URL}" \
            -F "project[revision]=${REVISION}" \
            -F "project[branch]=${BRANCH}" \
            -F "project[visibility]=private" \
            -F "format=cyclonedx" \
            -F "file=@./sboms/app-sbom.cdx.json" \
            -w "%{http_code}" -o /tmp/fossa_app_response.json || true)

          echo "FOSSA Application Upload HTTP Code: ${http_code_app}"
          echo "===== Application SBOM Response ====="
          cat /tmp/fossa_app_response.json || true
          echo ""

          echo "☁️ Uploading Container SBOM to FOSSA..."
          http_code_container=$(curl -s -S -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "project[name]=${REPO_URL}-container" \
            -F "project[revision]=${REVISION}" \
            -F "project[branch]=${BRANCH}" \
            -F "project[visibility]=private" \
            -F "format=cyclonedx" \
            -F "file=@./sboms/container-sbom.cdx.json" \
            -w "%{http_code}" -o /tmp/fossa_container_response.json || true)

          echo "FOSSA Container Upload HTTP Code: ${http_code_container}"
          echo "===== Container SBOM Response ====="
          cat /tmp/fossa_container_response.json || true

          # Simple result validation
          if [[ "${http_code_app}" != "200" && "${http_code_app}" != "201" ]]; then
            echo "⚠️ Application SBOM upload failed (HTTP ${http_code_app})"
            exit 1
          fi
          if [[ "${http_code_container}" != "200" && "${http_code_container}" != "201" ]]; then
            echo "⚠️ Container SBOM upload failed (HTTP ${http_code_container})"
            exit 1
          fi

          echo "✅ SBOMs successfully uploaded to FOSSA!"
