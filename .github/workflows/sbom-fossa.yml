name: SBOM Generation + FOSSA Upload

on:
  push:
    branches: [ feature/fossa-sbom ]
  workflow_dispatch:

jobs:
  fossa-cdxgen-pipeline:
    name: Generate SBOMs and Upload to FOSSA
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Checkout repository
      # -----------------------------------------------------------
      - name: 🧩 Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2️⃣ Setup Node.js
      # -----------------------------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------
      # 3️⃣ Install dependencies
      # -----------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci

      # -----------------------------------------------------------
      # 4️⃣ Create global.File shim (fix for cdxgen)
      # -----------------------------------------------------------
      - name: 🩹 Patch global.File
        run: |
          cat > /tmp/file-shim.js <<'JS'
          const { Blob } = globalThis;
          if (typeof globalThis.File === 'undefined') {
            globalThis.File = class File extends Blob {
              constructor(bits = [], name = 'file', options = {}) {
                super(bits, options);
                this.name = name;
                this.lastModified = options.lastModified || Date.now();
              }
            };
          }
          JS

      # -----------------------------------------------------------
      # 5️⃣ Generate Application SBOM (CycloneDX)
      # -----------------------------------------------------------
      - name: 🧾 Generate Application SBOM
        run: |
          NODE_OPTIONS="-r /tmp/file-shim.js" npx --yes @cyclonedx/cdxgen@latest -t nodejs -o app-sbom.cdx.json
          echo "✅ Application SBOM created → $(pwd)/app-sbom.cdx.json"

      # -----------------------------------------------------------
      # 6️⃣ Build and export Docker image
      # -----------------------------------------------------------
      - name: 🏗️ Build container image
        run: |
          docker build -t bookstore:latest .
          docker save bookstore:latest -o bookstore.tar
          echo "✅ Docker image built and saved as bookstore.tar"

      # -----------------------------------------------------------
      # 7️⃣ Install Trivy
      # -----------------------------------------------------------
      - name: 🔧 Install Trivy
        run: |
          TRIVY_VER=$(curl -sSL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VER}/trivy_${TRIVY_VER#v}_Linux-64bit.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # -----------------------------------------------------------
      # 8️⃣ Generate Container SBOM (Trivy)
      # -----------------------------------------------------------
      - name: 🧱 Generate Container SBOM
        run: |
          echo "🔍 Generating container SBOM..."
          trivy image --format cyclonedx --scanners vuln --output container-sbom.cdx.json bookstore:latest
          echo "✅ Container SBOM created → $(pwd)/container-sbom.cdx.json"

      # -----------------------------------------------------------
      # 9️⃣ Upload SBOMs as GitHub Artifacts
      # -----------------------------------------------------------
      - name: 📤 Upload SBOMs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: |
            app-sbom.cdx.json
            container-sbom.cdx.json

      # -----------------------------------------------------------
      # 🔟 Re-download artifacts in same run (for reliability)
      # -----------------------------------------------------------
      - name: 🔽 Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: ./sboms

      # -----------------------------------------------------------
      # 11️⃣ Verify SBOM files
      # -----------------------------------------------------------
      - name: 🧾 Verify SBOM files
        run: |
          echo "📁 Files downloaded:"
          ls -lh ./sboms || true
          if [ ! -f ./sboms/app-sbom.cdx.json ]; then
            echo "❌ Missing app-sbom.cdx.json"
            exit 1
          fi
          if [ ! -f ./sboms/container-sbom.cdx.json ]; then
            echo "❌ Missing container-sbom.cdx.json"
            exit 1
          fi
          echo "✅ SBOM files ready."

      # -----------------------------------------------------------
      # 12️⃣ Upload both SBOMs to FOSSA via official CLI binary
      # -----------------------------------------------------------
           - name: ☁️ Upload SBOMs to FOSSA using official CLI
        run: |
          set -euo pipefail

          echo "📦 Installing FOSSA CLI (auto-detecting latest stable release)..."

          # Step 1: Try to get latest valid asset URL from GitHub API
          FOSSA_URL=$(curl -s https://api.github.com/repos/fossas/fossa-cli/releases \
            | grep browser_download_url \
            | grep "Linux_x86_64.tar.gz" \
            | grep -v "rc" \
            | head -n 1 \
            | cut -d '"' -f 4)

          # Step 2: Fallback if not found
          if [ -z "${FOSSA_URL}" ]; then
            echo "⚠️ Could not detect latest release, falling back to v3.11.3"
            FOSSA_URL="https://github.com/fossas/fossa-cli/releases/download/v3.11.3/fossa-cli_3.11.3_Linux_x86_64.tar.gz"
          fi

          echo "⬇️ Downloading FOSSA CLI from: ${FOSSA_URL}"
          curl -fsSL -o fossa.tar.gz "${FOSSA_URL}" || { echo "❌ Failed to download FOSSA CLI"; exit 1; }

          if ! file fossa.tar.gz | grep -q 'gzip compressed'; then
            echo "❌ Invalid FOSSA CLI archive (download failed or not gzip)."
            head -n 20 fossa.tar.gz || true
            exit 1
          fi

          tar -xzf fossa.tar.gz
          sudo mv fossa /usr/local/bin/fossa
          fossa version || { echo "❌ FOSSA CLI install failed"; exit 1; }

          echo ""
          echo "🔑 Verifying FOSSA token..."
          if ! fossa whoami --api-key "${FOSSA_API_KEY}" > /tmp/fossa_user.txt 2>&1; then
            echo "❌ Invalid or expired FOSSA API key"
            cat /tmp/fossa_user.txt
            exit 1
          fi
          echo "✅ FOSSA token verified."

          echo ""
          echo "☁️ Uploading Application SBOM to FOSSA..."
          fossa sbom upload \
            --api-key "${FOSSA_API_KEY}" \
            --project "https://github.com/${{ github.repository }}" \
            --file ./sboms/app-sbom.cdx.json \
            --format cyclonedx || { echo "❌ Application SBOM upload failed"; exit 1; }

          echo ""
          echo "☁️ Uploading Container SBOM to FOSSA..."
          fossa sbom upload \
            --api-key "${FOSSA_API_KEY}" \
            --project "https://github.com/${{ github.repository }}-container" \
            --file ./sboms/container-sbom.cdx.json \
            --format cyclonedx || { echo "❌ Container SBOM upload failed"; exit 1; }

          echo ""
          echo "✅ SBOMs successfully uploaded to app.fossa.com!"
