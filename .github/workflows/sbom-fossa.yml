name: Upload SBOMs to FOSSA

on:
  workflow_dispatch:  # Run manually from Actions tab

jobs:
  upload-fossa:
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Download SBOM artifact generated from previous workflow
      # -----------------------------------------------------------
      - name: 🔽 Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: ./sboms

      # -----------------------------------------------------------
      # 2️⃣ Verify that both SBOMs exist
      # -----------------------------------------------------------
      - name: 📦 Verify SBOM files
        run: |
          echo "📁 Checking downloaded SBOM files..."
          ls -lh ./sboms || true

          if [ ! -f ./sboms/app-sbom.cdx.json ]; then
            echo "❌ Missing app-sbom.cdx.json"
            exit 1
          fi
          if [ ! -f ./sboms/container-sbom.cdx.json ]; then
            echo "❌ Missing container-sbom.cdx.json"
            exit 1
          fi
          echo "✅ SBOM files ready for upload."

      # -----------------------------------------------------------
      # 3️⃣ Upload both SBOMs to FOSSA via new /v2 API
      # -----------------------------------------------------------
      - name: ☁️ Upload SBOMs to FOSSA
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}"
          REVISION="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}" || BRANCH="${{ github.ref }}"

          echo "🔗 Uploading SBOMs to FOSSA:"
          echo "   Repo: ${REPO_URL}"
          echo "   Branch: ${BRANCH}"
          echo "   Commit: ${REVISION}"
          echo ""

          echo "☁️ Uploading Application SBOM..."
          http_app=$(curl -s -o /tmp/fossa_app.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload/v2" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "project[name]=${REPO_URL}" \
            -F "project[revision]=${REVISION}" \
            -F "project[branch]=${BRANCH}" \
            -F "project[visibility]=private" \
            -F "format=cyclonedx" \
            -F "file=@./sboms/app-sbom.cdx.json")

          echo "Application SBOM HTTP Code: ${http_app}"
          echo "Response:"
          cat /tmp/fossa_app.json || true
          echo ""

          echo "☁️ Uploading Container SBOM..."
          http_container=$(curl -s -o /tmp/fossa_container.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload/v2" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "project[name]=${REPO_URL}-container" \
            -F "project[revision]=${REVISION}" \
            -F "project[branch]=${BRANCH}" \
            -F "project[visibility]=private" \
            -F "format=cyclonedx" \
            -F "file=@./sboms/container-sbom.cdx.json")

          echo "Container SBOM HTTP Code: ${http_container}"
          echo "Response:"
          cat /tmp/fossa_container.json || true
          echo ""

          if [[ "${http_app}" != "200" && "${http_app}" != "201" ]]; then
            echo "⚠️ Application SBOM upload failed. Response below:"
            cat /tmp/fossa_app.json || true
            exit 1
          fi
          if [[ "${http_container}" != "200" && "${http_container}" != "201" ]]; then
            echo "⚠️ Container SBOM upload failed. Response below:"
            cat /tmp/fossa_container.json || true
            exit 1
          fi

          echo "✅ Both SBOMs successfully uploaded to FOSSA."
