name: FOSSA + CycloneDX SBOM Workflow (feature/fossa-sbom)

on:
  push:
    branches: [ feature/fossa-sbom ]
  pull_request:
    branches: [ feature/fossa-sbom ]

jobs:
  fossa-cdxgen-pipeline:
    name: Generate Application & Container SBOM with CycloneDX
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Checkout repository
      # -----------------------------------------------------------
      - name: 🧩 Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2️⃣ Setup Node environment (Node 20 LTS)
      # -----------------------------------------------------------
      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------
      # 3️⃣ Install dependencies
      # -----------------------------------------------------------
      - name: 📦 Install npm dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "✅ Installation complete"

      # -----------------------------------------------------------
      # 4️⃣ Install CycloneDX Generator (cdxgen)
      # -----------------------------------------------------------
      - name: 🧰 Install CycloneDX Generator
        run: |
          echo "Installing @cyclonedx/cdxgen globally..."
          npm install -g @cyclonedx/cdxgen
          echo "✅ cdxgen installed successfully"

      # -----------------------------------------------------------
      # 5️⃣ Generate Application SBOM
      # -----------------------------------------------------------
      - name: 🧾 Generate Application SBOM (Node.js)
        run: |
          echo "🔍 Generating Application SBOM using cdxgen..."
          cdxgen -t nodejs -o app-sbom.cdx.json
          echo "✅ Application SBOM created → $(pwd)/app-sbom.cdx.json"

      # -----------------------------------------------------------
      # 6️⃣ Build container image
      # -----------------------------------------------------------
      - name: 🏗️ Build container image
        run: |
          echo "🏗️ Building container image (bookstore:latest)..."
          docker build -t bookstore:latest .
          echo "✅ Container image built successfully"

      # -----------------------------------------------------------
      # 7️⃣ Generate Container SBOM
      # -----------------------------------------------------------
      - name: 🧱 Generate Container SBOM (Docker image)
        run: |
          echo "🔍 Generating Container SBOM using cdxgen..."
          cdxgen -t docker -p bookstore:latest -o container-sbom.cdx.json
          echo "✅ Container SBOM created → $(pwd)/container-sbom.cdx.json"

      # -----------------------------------------------------------
      # 8️⃣ Upload SBOMs as artifacts
      # -----------------------------------------------------------
      - name: 📤 Upload SBOM artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: |
            app-sbom.cdx.json
            container-sbom.cdx.json

      # -----------------------------------------------------------
      # 9️⃣ Upload both SBOMs to FOSSA SBOM Import API
      # -----------------------------------------------------------
      - name: ☁️ Upload SBOMs to FOSSA dashboard
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          echo "☁️ Uploading Application SBOM to FOSSA..."
          curl -s -o response_app.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "name=nodejs-bookstore-api-application" \
            -F "format=cyclonedx" \
            -F "file=@app-sbom.cdx.json"

          echo "☁️ Uploading Container SBOM to FOSSA..."
          curl -s -o response_container.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "name=nodejs-bookstore-api-container" \
            -F "format=cyclonedx" \
            -F "file=@container-sbom.cdx.json"

          echo "✅ SBOMs successfully uploaded to FOSSA dashboard."

      # -----------------------------------------------------------
      # 🔟 Display SBOM summaries (optional)
      # -----------------------------------------------------------
      - name: 📊 Display SBOM summaries
        run: |
          echo "===== Application SBOM Preview ====="
          head -n 15 app-sbom.cdx.json
          echo ""
          echo "===== Container SBOM Preview ====="
          head -n 15 container-sbom.cdx.json
          echo "✅ Workflow complete!"
