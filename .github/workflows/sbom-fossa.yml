name: FOSSA + CycloneDX SBOM Workflow (feature/fossa-sbom)

on:
  push:
    branches: [ feature/fossa-sbom ]
  pull_request:
    branches: [ feature/fossa-sbom ]

jobs:
  fossa-cdxgen-pipeline:
    name: Generate Application & Container SBOM with CycloneDX
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 1️⃣ Checkout repository
      # -----------------------------------------------------------
      - name: 🧩 Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2️⃣ Setup Node environment
      # -----------------------------------------------------------
      - name: ⚙️ Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------
      # 3️⃣ Install dependencies
      # -----------------------------------------------------------
      - name: 📦 Install npm dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "✅ Installation complete"

      # -----------------------------------------------------------
      # 4️⃣ Install CycloneDX cdxgen tool
      # -----------------------------------------------------------
      - name: 🧰 Install CycloneDX Generator (cdxgen)
        run: |
          echo "Installing cdxgen globally..."
          npm install -g @cyclonedx/cdxgen
          echo "✅ cdxgen installed successfully"

      # -----------------------------------------------------------
      # 5️⃣ Generate Application SBOM (CycloneDX)
      # -----------------------------------------------------------
      - name: 🧾 Generate Application SBOM
        run: |
          echo "🔍 Generating application SBOM..."
          cdxgen -t nodejs -o app-sbom.cdx.json
          echo "✅ Application SBOM created: $(pwd)/app-sbom.cdx.json"
          head -n 10 app-sbom.cdx.json

      # -----------------------------------------------------------
      # 6️⃣ Build the container image
      # -----------------------------------------------------------
      - name: 🏗️ Build container image
        run: |
          echo "🏗️ Building container image for bookstore:latest ..."
          docker build -t bookstore:latest .
          echo "✅ Container image built successfully"

      # -----------------------------------------------------------
      # 7️⃣ Generate Container SBOM (CycloneDX)
      # -----------------------------------------------------------
      - name: 🧱 Generate Container SBOM
        run: |
          echo "🔍 Generating container SBOM..."
          cdxgen -t docker -o container-sbom.cdx.json -p bookstore:latest
          echo "✅ Container SBOM created: $(pwd)/container-sbom.cdx.json"
          head -n 10 container-sbom.cdx.json

      # -----------------------------------------------------------
      # 8️⃣ Upload SBOMs as artifacts
      # -----------------------------------------------------------
      - name: 📤 Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-dx-sboms
          path: |
            app-sbom.cdx.json
            container-sbom.cdx.json

      # -----------------------------------------------------------
      # 9️⃣ Upload both SBOMs to FOSSA SBOM Import API
      # -----------------------------------------------------------
      - name: ☁️ Upload SBOMs to FOSSA dashboard
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          echo "☁️ Uploading Application SBOM to FOSSA API..."
          curl -s -o response_app.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "name=nodejs-bookstore-api-application" \
            -F "format=cyclonedx" \
            -F "file=@app-sbom.cdx.json"

          echo "☁️ Uploading Container SBOM to FOSSA API..."
          curl -s -o response_container.json -w "%{http_code}" \
            -X POST "https://app.fossa.com/api/projects/custom/upload" \
            -H "Authorization: token ${FOSSA_API_KEY}" \
            -F "name=nodejs-bookstore-api-container" \
            -F "format=cyclonedx" \
            -F "file=@container-sbom.cdx.json"

          echo "✅ Both SBOMs uploaded to FOSSA successfully!"

      # -----------------------------------------------------------
      # 🔟 Display summary (optional)
      # -----------------------------------------------------------
      - name: 📊 Display SBOM Summary
        run: |
          echo "Application SBOM snippet:"
          head -n 10 app-sbom.cdx.json
          echo ""
          echo "Container SBOM snippet:"
          head -n 10 container-sbom.cdx.json
          echo "✅ SBOM generation and uploads complete!"
